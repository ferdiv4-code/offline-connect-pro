
name: Build Offline Connect Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install --prefer-online --registry=https://registry.npmjs.org/
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Check Expo dependencies
        run: npx expo install --fix

      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build standalone release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Find generated APK
        run: |
          echo "Checking generated release APK..."
          find android/app/build/outputs/apk/release -type f -name "*.apk"

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-connect-pro-standalone-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
