
name: Build Offline Connect Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Clear npm cache
        run: npm cache clean --force

      - name: Install dependencies
        run: npm install --prefer-online --registry=https://registry.npmjs.org/
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000

      - name: Fix Expo dependencies
        run: npx expo install --fix

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Diagnose Expo module configuration
        run: |
          npx expo-modules-autolinking resolve --platform android > autolinking.json
          node -e "const c=require('./autolinking.json'); console.log('TOTAL MODULES:',c.modules?.length); console.log('MODULE AT INDEX 8:'); console.log(JSON.stringify(c.modules?.[8],null,2)); console.log('ALL MODULE NAMES:'); console.log(c.modules?.map((m,i)=>i+': '+(m.packageName || m.name)).join('\n'))"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-connect-pro-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
